# Release-line identity for `build-apk.sh --release` builds.
# The bench/debug line keeps AndroidManifest.xml's versionCode 1 / versionName
# 1.0 — the release line is signed with a DIFFERENT key (mazarelease) and can
# never install over the bench build, so its version numbering is independent.
# Start the release line at 2 (> the bench line's 1) and bump both values
# together for every future release. aapt2 link receives these via
# --version-code/--version-name; AndroidManifest.xml is not modified.
versionCode=2
versionName=1.0.0
